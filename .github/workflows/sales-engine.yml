name: Daily Sales Engine

on:
  schedule:
    # 13:05 UTC daily ≈ 8am US Central — leads found overnight get scored
    # and drafted before the workday starts.
    - cron: "5 13 * * *"
  workflow_dispatch: {}      # run it manually from the Actions tab any time

permissions:
  contents: write

concurrency:
  group: sales-engine
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
          DAILY_EMAIL_CAP: ${{ vars.DAILY_EMAIL_CAP }}
        run: python run_engine.py daily

      - name: Commit results
        run: |
          git config user.name "sales-engine-bot"
          git config user.email "actions@github.com"
          git add data/ dashboard/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily sales engine run $(date -u +%F)"
            git push
          fi
