name: Daily Sales Engine

on:
  schedule:
    # Every 4 hours, around the clock — Doc2Translate's starting niche is
    # European, so the engine must be awake during the EU business day
    # (roughly 07:00-17:00 UTC) as well as US hours. Speed-to-lead is the
    # whole game on forums: a reply on a 2-hour-old thread far outperforms a
    # day-old one. Cost stays flat: sources are free APIs and dedupe means
    # Claude only scores signals it hasn't seen before. The digest still
    # goes out once per day (first run after 13:00 UTC).
    - cron: "5 1,5,9,13,17,21 * * *"
  workflow_dispatch: {}      # run it manually from the Actions tab any time

permissions:
  contents: write
  issues: write

concurrency:
  group: sales-engine
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
          DAILY_EMAIL_CAP: ${{ vars.DAILY_EMAIL_CAP }}
        run: python run_engine.py daily

      - name: Commit results
        run: |
          git config user.name "sales-engine-bot"
          git config user.email "actions@github.com"
          git add data/ dashboard/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sales engine run $(date -u '+%F %H:%M')"
            git pull --rebase && git push
          fi

      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'engine-failure',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again at ${date} UTC — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Sales engine run failed (${date} UTC)`,
                labels: ['engine-failure'],
                body: `The scheduled run failed. Logs: ${runUrl}\n\nCommon causes: missing/expired ANTHROPIC_API_KEY secret, or a source API outage (those are skipped gracefully, so check the logs).`,
              });
            }
